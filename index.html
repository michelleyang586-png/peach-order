<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>餘有榮焉｜水蜜桃訂購</title>

<script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>

<style>

:root {
  --peach-main: #FF8A8A;
  --peach-light: #FFF0F0;
  --bg-color: #FAFAFA;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:"PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg-color);
  color:#444;
  line-height:1.5;
}

.header{
  background:linear-gradient(145deg,#FF9A9E 0%,#FAD0C4 100%);
  color:white;
  padding:40px 20px;
  text-align:center;
  border-radius:0 0 30px 30px;
}

.header h1{
  font-size:24px;
}

.header p{
  font-size:14px;
  margin-top:8px;
}

.container{
  padding:20px 16px;
  max-width:500px;
  margin:-20px auto 0;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 8px 24px rgba(149,157,165,0.1);
}

.card h2{
  font-size:16px;
  color:var(--peach-main);
  margin-bottom:16px;
}

.delivery-toggle{
  display:flex;
  gap:10px;
  background:#F0F0F0;
  padding:4px;
  border-radius:12px;
}

.delivery-btn{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  background:transparent;
  font-size:14px;
  cursor:pointer;
  color:#777;
}

.delivery-btn.active{
  background:white;
  color:var(--peach-main);
  font-weight:bold;
}

.spec-card{
  border:1px solid #EEE;
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
  transition:0.3s;
}

.spec-card.has-qty{
  border-color:var(--peach-main);
  background:var(--peach-light);
}

.spec-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.spec-name{
  font-size:16px;
  font-weight:600;
}

.spec-price{
  font-size:15px;
  color:var(--peach-main);
  font-weight:700;
}

.qty-control{
  display:flex;
  align-items:center;
  gap:15px;
}

.qty-btn{
  width:32px;
  height:32px;
  border-radius:10px;
  border:none;
  background:white;
  color:var(--peach-main);
  font-size:18px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
  cursor:pointer;
}

.qty-num{
  font-size:18px;
  font-weight:bold;
  min-width:24px;
  text-align:center;
}

.field{
  margin-bottom:15px;
}

.field label{
  font-size:13px;
  font-weight:600;
  color:#888;
  margin-bottom:8px;
  display:block;
}

input,
textarea{
  background:#F9F9F9;
  border:1px solid #EDEDED;
  padding:14px;
  border-radius:12px;
  font-size:15px;
  width:100%;
}

.price-display{
  background:#333;
  color:#EEE;
  border-radius:16px;
  padding:20px;
  margin-top:10px;
}

.price-row{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin-bottom:8px;
}

.price-total{
  display:flex;
  justify-content:space-between;
  font-size:20px;
  font-weight:bold;
  color:white;
  border-top:1px solid rgba(255,255,255,0.1);
  padding-top:12px;
  margin-top:8px;
}

.submit-btn{
  width:100%;
  padding:18px;
  background:var(--peach-main);
  color:white;
  border:none;
  border-radius:18px;
  font-size:17px;
  font-weight:bold;
  margin:20px 0 40px;
  cursor:pointer;
}

.peach-down{
  display:inline-block;
  transform:rotate(180deg);
}

</style>
</head>

<body>

<div class="header">
  <h1>餘有榮焉 🍑 紅鈴水蜜桃</h1>
  <p>果園產地直送 ‧ 享受清甜滋味</p>
</div>

<div class="container">

  <div class="card">

    <h2>取貨方式</h2>

    <div class="delivery-toggle">

      <button
        class="delivery-btn active"
        id="btn-pickup"
        onclick="setDelivery('自取')">

        🏪 現場自取

      </button>

      <button
        class="delivery-btn"
        id="btn-delivery"
        onclick="setDelivery('宅配')">

        ❄️ 黑貓冷藏宅配

      </button>

    </div>

  </div>

  <div class="card">

    <h2>挑選規格</h2>

    <div id="spec-list"></div>

    <p
      id="empty-warning"
      style="color:#ff6b6b;font-size:13px;text-align:center;display:none;">

      別忘了選購好吃的水蜜桃喔！

    </p>

  </div>

  <div class="card">

    <h2>收件資訊</h2>

    <div class="field">
      <label>聯絡姓名</label>
      <input type="text" id="name" placeholder="請填寫姓名">
    </div>

    <div class="field">
      <label>手機號碼</label>
      <input type="tel" id="phone" placeholder="09XX-XXX-XXX">
    </div>

    <div
      class="field"
      id="address-section"
      style="display:none;">

      <label>宅配地址</label>

      <input
        type="text"
        id="address"
        placeholder="完整收件地址">

    </div>

    <div class="field">
      <label>備註需求</label>
      <textarea id="note" rows="2"></textarea>
    </div>

  </div>

  <div class="price-display" id="price-display"></div>

  <button
    class="submit-btn"
    id="submit-btn"
    onclick="submitOrder()">

    確認送出訂單

  </button>

</div>

<script>

const LIFF_ID = '2009767596-jd7WjD99';

const API_URL =
'https://peach-api-indol.vercel.app/api/order';

const SPECS = [

  {
    name:'🍑 特2顆（自取限定）',
    short:'特2顆',
    price:150,
    pickupOnly:true
  },

  {
    name:'🍑 特4顆（自取限定）',
    short:'特4顆',
    price:200,
    pickupOnly:true
  },

  {
    name:'🎁 禮盒大6顆',
    short:'禮盒大6顆',
    price:500
  },

  {
    name:'🎁 禮盒大8顆',
    short:'禮盒大8顆',
    price:450
  },

  {
    name:'🍑 家庭盒中16顆',
    short:'家庭盒中16顆',
    price:400
  }

];

let pickupQtys = [0,0,0,0,0];
let deliveryQtys = [0,0,0,0,0];

let deliveryType = '自取';

let lineName = '';
let lineUserId = '';

const SHIPPING_PER_BOX = 290;

function getCurrentQtys(){

  return deliveryType === '自取'
    ? pickupQtys
    : deliveryQtys;

}

function renderSpecs(){

  const qtys = getCurrentQtys();

  let html = '';

  SPECS.forEach((spec,index)=>{

    if (
      deliveryType === '宅配' &&
      spec.pickupOnly
    ) return;

    html += `
      <div
        class="spec-card ${qtys[index] > 0 ? 'has-qty' : ''}"
        id="spec-card-${index}">

        <div class="spec-header">

          <div>
            <div class="spec-name">${spec.name}</div>
            <div class="spec-price">
              NT$ ${spec.price} / 盒
            </div>
          </div>

          <div class="qty-control">

            <button
              class="qty-btn"
              onclick="changeQty(${index},-1)">
              −
            </button>

            <span
              class="qty-num"
              id="qty-${index}">
              ${qtys[index]}
            </span>

            <button
              class="qty-btn"
              onclick="changeQty(${index},1)">
              +
            </button>

          </div>

        </div>

      </div>
    `;

  });

  document.getElementById('spec-list').innerHTML =
    html;

}

async function init(){

  try{

    await liff.init({ liffId: LIFF_ID });

    if(liff.isLoggedIn()){

      const profile =
        await liff.getProfile();

      lineName = profile.displayName;
      lineUserId = profile.userId;

    }else{

      liff.login();

    }

  }catch(e){}

  renderSpecs();
  updatePriceDisplay();

}

function setDelivery(type){

  deliveryType = type;

  document.getElementById('btn-pickup').className =
    'delivery-btn' +
    (type === '自取' ? ' active' : '');

  document.getElementById('btn-delivery').className =
    'delivery-btn' +
    (type === '宅配' ? ' active' : '');

  document.getElementById('address-section').style.display =
    type === '宅配'
      ? 'block'
      : 'none';

  renderSpecs();
  updatePriceDisplay();

}

function changeQty(idx,delta){

  const qtys = getCurrentQtys();

  qtys[idx] =
    Math.max(0, qtys[idx] + delta);

  renderSpecs();
  updatePriceDisplay();

}

function calcShipping(){

  if(deliveryType !== '宅配') return 0;

  const qtys = deliveryQtys;

  const totalBoxes =
    qtys[2] +
    qtys[3] +
    qtys[4];

  if(totalBoxes === 0) return 0;

  return Math.ceil(totalBoxes / 2)
    * SHIPPING_PER_BOX;

}

function updatePriceDisplay(){

  const qtys = getCurrentQtys();

  let html = '';

  let subtotal = 0;

  SPECS.forEach((spec,index)=>{

    if(qtys[index] <= 0) return;

    const amount =
      qtys[index] * spec.price;

    subtotal += amount;

    html += `
      <div class="price-row">
        <span>
          ${spec.short} x ${qtys[index]}
        </span>
        <span>
          NT$ ${amount}
        </span>
      </div>
    `;

  });

  const shipping = calcShipping();

  if(shipping > 0){

    html += `
      <div class="price-row">
        <span>黑貓冷藏宅配運費</span>
        <span>NT$ ${shipping}</span>
      </div>
    `;

  }

  const total = subtotal + shipping;

  html += `
    <div class="price-total">
      <span>總計金額</span>
      <span>NT$ ${total}</span>
    </div>
  `;

  document.getElementById('price-display').innerHTML =
    html;

}

async function submitOrder(){

  const qtys = getCurrentQtys();

  const totalBoxes =
    qtys.reduce((a,b)=>a+b,0);

  if(totalBoxes === 0){

    document.getElementById('empty-warning')
      .style.display = 'block';

    return;

  }

  const name =
    document.getElementById('name').value.trim();

  const phone =
    document.getElementById('phone').value.trim();

  const address =
    document.getElementById('address').value.trim();

  const note =
    document.getElementById('note').value.trim();

  if(!name || !phone){

    alert('請填寫姓名和電話');
    return;

  }

  if(
    deliveryType === '宅配' &&
    !address
  ){

    alert('請填寫宅配地址');
    return;

  }

  const shipping = calcShipping();

  let subtotal = 0;

  SPECS.forEach((spec,index)=>{

    subtotal +=
      qtys[index] * spec.price;

  });

  const totalAmount =
    subtotal + shipping;

  const specSummary =
    SPECS.map((s,i)=>

      qtys[i] > 0
        ? s.short + ' x' + qtys[i]
        : null

    ).filter(Boolean).join('、');

  const btn =
    document.getElementById('submit-btn');

  btn.disabled = true;

  btn.textContent = '訂單處理中...';

  try{

    const params = new URLSearchParams({

      action:'order',

      lineName: lineName || name,

      recipientName:name,

      lineUserId: lineUserId || '',

      phone,

      deliveryType,

      spec0:String(qtys[0]),
      spec1:String(qtys[1]),
      spec2:String(qtys[2]),
      spec3:String(qtys[3]),
      spec4:String(qtys[4]),

      specSummary,

      amount:String(totalAmount),

      address:
        deliveryType === '宅配'
          ? address
          : '自取',

      note:note || ''

    });

    const res =
      await fetch(API_URL + '?' + params.toString());

    const result =
      await res.json();

    if(result.status === 'success'){

      alert('訂單送出成功！');

      location.reload();

    }else{

      throw new Error();

    }

  }catch(e){

    alert('送出失敗，請稍後再試');

    btn.disabled = false;

    btn.textContent = '確認送出訂單';

  }

}

init();

</script>

</body>
</html>
