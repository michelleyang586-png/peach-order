<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>餘有榮焉｜水蜜桃訂購</title>

<script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>

<style>

.qty-control{
  display:flex;
  align-items:center;
  gap:12px;
}

.qty-btn{
  width:48px;
  height:48px;
  border:none;
  border-radius:14px;
  background:#FFF;
  color:var(--peach-main);
  font-size:28px;
  font-weight:bold;
  box-shadow:0 3px 10px rgba(0,0,0,0.12);
  cursor:pointer;
}

.qty-btn:active{
  transform:scale(0.95);
}

.qty-input{
  width:72px;
  height:48px;
  border:1px solid #EEE;
  border-radius:14px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  background:#FFF;
}

.qty-input::-webkit-inner-spin-button,
.qty-input::-webkit-outer-spin-button{
  -webkit-appearance:none;
  margin:0;
}

</style>
</head>

<body>

<div id="main-screen">

  <div class="header">
<h1>餘有榮焉 <span class="peach-down">🍑</span> 紅鈴水蜜桃</h1>
    <p>果園產地直送 ‧ 享受清甜滋味</p>
  </div>

  <div class="container">

    <div class="card">

      <h2>取貨方式</h2>

      <div class="delivery-toggle">
        <button class="delivery-btn active"
          onclick="setDelivery('自取')"
          id="btn-pickup">
          🏪 現場自取
        </button>

        <button class="delivery-btn"
          onclick="setDelivery('宅配')"
          id="btn-delivery">
          ❄️ 黑貓冷藏宅配
        </button>
      </div>

    </div>

    <div class="card">

  <h2>挑選規格</h2>

  <!-- 特2顆 -->
  <div class="spec-card pickup-only" id="spec-card-0">

    <div class="spec-header">

      <div>
        <div class="spec-name">
          🍑 特2顆（自取限定）
        </div>

        <div class="spec-price">
          NT$ 150 / 盒
        </div>
      </div>

      <div class="qty-control">

        <button
          class="qty-btn"
          onclick="changeQty(0,-1)">
          −
        </button>

        <input
          type="number"
          class="qty-input"
          id="qty-0"
          value="0"
          min="0"
          onchange="manualQty(0,this.value)"
        >

        <button
          class="qty-btn"
          onclick="changeQty(0,1)">
          +
        </button>

      </div>

    </div>

  </div>

  <!-- 特4顆 -->
  <div class="spec-card pickup-only" id="spec-card-1">

    <div class="spec-header">

      <div>
        <div class="spec-name">
          🍑 特4顆（自取限定）
        </div>

        <div class="spec-price">
          NT$ 200 / 盒
        </div>
      </div>

      <div class="qty-control">

        <button
          class="qty-btn"
          onclick="changeQty(1,-1)">
          −
        </button>

        <input
          type="number"
          class="qty-input"
          id="qty-1"
          value="0"
          min="0"
          onchange="manualQty(1,this.value)"
        >

        <button
          class="qty-btn"
          onclick="changeQty(1,1)">
          +
        </button>

      </div>

    </div>

  </div>

  <!-- 大6 -->
  <div class="spec-card" id="spec-card-2">

    <div class="spec-header">

      <div>
        <div class="spec-name">
          🎁 禮盒大6顆
        </div>

        <div class="spec-price">
          NT$ 500 / 盒
        </div>
      </div>

      <div class="qty-control">

        <button
          class="qty-btn"
          onclick="changeQty(2,-1)">
          −
        </button>

        <input
          type="number"
          class="qty-input"
          id="qty-2"
          value="0"
          min="0"
          onchange="manualQty(2,this.value)"
        >

        <button
          class="qty-btn"
          onclick="changeQty(2,1)">
          +
        </button>

      </div>

    </div>

  </div>

  <!-- 大8 -->
  <div class="spec-card" id="spec-card-3">

    <div class="spec-header">

      <div>
        <div class="spec-name">
          🎁 禮盒大8顆
        </div>

        <div class="spec-price">
          NT$ 450 / 盒
        </div>
      </div>

      <div class="qty-control">

        <button
          class="qty-btn"
          onclick="changeQty(3,-1)">
          −
        </button>

        <input
          type="number"
          class="qty-input"
          id="qty-3"
          value="0"
          min="0"
          onchange="manualQty(3,this.value)"
        >

        <button
          class="qty-btn"
          onclick="changeQty(3,1)">
          +
        </button>

      </div>

    </div>

  </div>

  <!-- 中16 -->
  <div class="spec-card" id="spec-card-4">

    <div class="spec-header">

      <div>
        <div class="spec-name">
          🍑 家庭盒中16顆
        </div>

        <div class="spec-price">
          NT$ 400 / 盒
        </div>
      </div>

      <div class="qty-control">

        <button
          class="qty-btn"
          onclick="changeQty(4,-1)">
          −
        </button>

        <input
          type="number"
          class="qty-input"
          id="qty-4"
          value="0"
          min="0"
          onchange="manualQty(4,this.value)"
        >

        <button
          class="qty-btn"
          onclick="changeQty(4,1)">
          +
        </button>

      </div>

    </div>

  </div>

  <p
    id="empty-warning"
    style="
      color:#ff6b6b;
      font-size:13px;
      text-align:center;
      display:none;
    "
  >
    別忘了選購好吃的水蜜桃喔！
  </p>

</div>

    <div class="card">

      <h2>收件資訊</h2>

      <div class="field" style="margin-bottom:15px;">
        <label>聯絡姓名</label>
        <input type="text" id="name" placeholder="請填寫姓名">
      </div>

      <div class="field" style="margin-bottom:15px;">
        <label>手機號碼</label>
        <input type="tel" id="phone" placeholder="09XX-XXX-XXX">
      </div>

      <div class="field address-section"
        id="address-section"
        style="margin-bottom:15px;display:none;">

        <label>宅配地址</label>
        <input type="text" id="address" placeholder="完整收件地址">

      </div>

      <div class="field">
        <label>備註需求</label>
        <textarea id="note" rows="2"></textarea>
      </div>

    </div>

    <div class="price-display" id="price-display"></div>

    <button class="submit-btn"
      id="submit-btn"
      onclick="submitOrder()">

      確認送出訂單

    </button>

  </div>

</div>

<script>

const LIFF_ID = '2009767596-jd7WjD99';

const API_URL =
'https://peach-api-indol.vercel.app/api/order';

const SPECS = [

  { name:'特2顆', price:150, key:'spec0', pickupOnly:true },
  { name:'特4顆', price:200, key:'spec1', pickupOnly:true },
  { name:'禮盒大6顆', price:500, key:'spec2' },
  { name:'禮盒大8顆', price:450, key:'spec3' },
  { name:'家庭盒中16顆', price:400, key:'spec4' }

];

let qtys = [0,0,0,0,0];

let deliveryType = '自取';

let lineName = '';
let lineUserId = '';

const SHIPPING_PER_BOX = 290;

async function init() {

  try {

    await liff.init({ liffId: LIFF_ID });

    if (liff.isLoggedIn()) {

      const profile = await liff.getProfile();

      lineName = profile.displayName;
      lineUserId = profile.userId;

    } else {

      liff.login();

    }

  } catch(e) {}

  updateSpecVisibility();
  updatePriceDisplay();

}

function setDelivery(type) {

  deliveryType = type;

  document.getElementById('btn-pickup').className =
    'delivery-btn' + (type === '自取' ? ' active' : '');

  document.getElementById('btn-delivery').className =
    'delivery-btn' + (type === '宅配' ? ' active' : '');

  document.getElementById('address-section').style.display =
    type === '宅配' ? 'block' : 'none';

  updateSpecVisibility();

  updatePriceDisplay();

}

function updateSpecVisibility() {

  const pickupOnlyCards =
    document.querySelectorAll('.pickup-only');

  pickupOnlyCards.forEach(card => {

    card.style.display =
      deliveryType === '自取'
        ? 'block'
        : 'none';

  });

  if (deliveryType === '宅配') {

    qtys[0] = 0;
    qtys[1] = 0;

    document.getElementById('qty-0').textContent = 0;
    document.getElementById('qty-1').textContent = 0;

  }

}

function changeQty(idx, delta) {

  qtys[idx] = Math.max(0, qtys[idx] + delta);

  document.getElementById('qty-' + idx).textContent =
    qtys[idx];

  document.getElementById('spec-card-' + idx).className =
    'spec-card' +
    (SPECS[idx].pickupOnly ? ' pickup-only' : '') +
    (qtys[idx] > 0 ? ' has-qty' : '');

  updatePriceDisplay();

}

function calcShipping() {

  if (deliveryType !== '宅配') return 0;

  const deliveryBoxes =
    qtys[2] +
    qtys[3] +
    qtys[4];

  if (deliveryBoxes === 0) return 0;

  const shippingUnits =
    Math.ceil(deliveryBoxes / 2);

  return shippingUnits * SHIPPING_PER_BOX;

}

function updatePriceDisplay() {

  let html = '';

  let subtotal = 0;

  for (let i = 0; i < SPECS.length; i++) {

    if (qtys[i] <= 0) continue;

    const amount = qtys[i] * SPECS[i].price;

    subtotal += amount;

    html += `
      <div class="price-row">
        <span>${SPECS[i].name} x ${qtys[i]}</span>
        <span>NT$ ${amount}</span>
      </div>
    `;

  }

  const shipping = calcShipping();

  if (shipping > 0) {

    html += `
      <div class="price-row">
        <span>黑貓冷藏宅配運費</span>
        <span>NT$ ${shipping}</span>
      </div>
    `;

  }

  const total = subtotal + shipping;

  html += `
    <div class="price-total">
      <span>總計金額</span>
      <span>NT$ ${total}</span>
    </div>
  `;

  document.getElementById('price-display').innerHTML =
    html;

}

async function submitOrder() {

  const name =
    document.getElementById('name').value.trim();

  const phone =
    document.getElementById('phone').value.trim();

  const address =
    document.getElementById('address').value.trim();

  const note =
    document.getElementById('note').value.trim();

  const totalBoxes =
    qtys.reduce((a,b)=>a+b,0);

  if (totalBoxes === 0) {

    document.getElementById('empty-warning')
      .style.display = 'block';

    return;

  }

  if (!name || !phone) {

    alert('請填寫姓名和電話');

    return;

  }

  if (deliveryType === '宅配' && !address) {

    alert('請填寫宅配地址');

    return;

  }

  const shipping = calcShipping();

  let subtotal = 0;

  for (let i = 0; i < SPECS.length; i++) {

    subtotal += qtys[i] * SPECS[i].price;

  }

  const totalAmount = subtotal + shipping;

  const specSummary =
    SPECS.map((s,i)=>

      qtys[i] > 0
        ? s.name + ' x' + qtys[i]
        : null

    ).filter(Boolean).join('、');

  const btn =
    document.getElementById('submit-btn');

  btn.disabled = true;

  btn.textContent = '訂單處理中...';

  try {

    const params = new URLSearchParams({

      action:'order',

      lineName: lineName || name,

      recipientName:name,

      lineUserId: lineUserId || '',

      phone,

      deliveryType,

      spec0:String(qtys[0]),
      spec1:String(qtys[1]),
      spec2:String(qtys[2]),
      spec3:String(qtys[3]),
      spec4:String(qtys[4]),

      specSummary,

      amount:String(totalAmount),

      address:address || '自取',

      note:note || ''

    });

    const res =
      await fetch(API_URL + '?' + params.toString());

    const result =
      await res.json();

    if (result.status === 'success') {

      alert('訂單送出成功！');

      location.reload();

    } else {

      throw new Error();

    }

  } catch(e) {

    alert('送出失敗，請稍後再試');

    btn.disabled = false;

    btn.textContent = '確認送出訂單';

  }

}

init();

</script>
  <script>

function manualQty(idx,value){

  qtys[idx] = Math.max(
    0,
    parseInt(value) || 0
  );

  document.getElementById(
    'qty-' + idx
  ).value = qtys[idx];

  document.getElementById(
    'spec-card-' + idx
  ).className =
    'spec-card' +
    (SPECS[idx].pickupOnly
      ? ' pickup-only'
      : '') +
    (qtys[idx] > 0
      ? ' has-qty'
      : '');

  updatePriceDisplay();

}

</script>

</body>
</html>
