<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餘有榮焉｜水蜜桃訂購</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    :root {
      --peach-main: #FF8A8A;
      --peach-light: #FFF0F0;
      --bg-color: #FAFAFA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-color); color: #444; line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: linear-gradient(145deg, #FF9A9E 0%, #FAD0C4 100%);
      color: white; padding: 40px 20px; text-align: center;
      border-radius: 0 0 30px 30px;
      box-shadow: 0 4px 15px rgba(255,138,138,0.3);
    }
    .header h1 { font-size: 24px; letter-spacing: 1px; }
    .header p  { font-size: 14px; margin-top: 8px; opacity: 0.9; }

    .container {
      padding: 32px 20px 48px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .closed-card {
      background: white;
      border-radius: 24px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(149,157,165,0.15);
      width: 100%;
    }

    .closed-icon {
      font-size: 80px;
      margin-bottom: 20px;
      display: block;
    }

    .closed-title {
      font-size: 22px;
      font-weight: 800;
      color: #333;
      margin-bottom: 12px;
    }

    .closed-sub {
      font-size: 15px;
      color: #888;
      line-height: 1.9;
      margin-bottom: 24px;
    }

    .closed-divider {
      border: none;
      border-top: 1px dashed #FFD0D0;
      margin: 24px 0;
    }

    .next-year {
      background: linear-gradient(145deg, #FF9A9E 0%, #FAD0C4 100%);
      border-radius: 16px;
      padding: 20px;
      color: white;
    }

    .next-year .ny-icon { font-size: 36px; margin-bottom: 8px; display: block; }
    .next-year .ny-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .next-year .ny-text  { font-size: 14px; opacity: 0.9; line-height: 1.8; }

    .thanks {
      margin-top: 24px;
      font-size: 13px;
      color: #aaa;
      line-height: 1.9;
    }
    .thanks b { color: var(--peach-main); }
  </style>
</head>
<body>
  <div class="header">
    <h1>餘有榮焉 🍑 紅鈴水蜜桃</h1>
    <p>果園產地直送 ‧ 享受清甜滋味</p>
  </div>

  <div class="container">
    <div class="closed-card">
      <span class="closed-icon">🍑</span>
      <div class="closed-title">今年的水蜜桃季節已結束</div>
      <div class="closed-sub">
        感謝您今年的支持與喜愛 🙏<br>
        今年度的紅鈴水蜜桃訂購<br>
        已於本週圓滿落幕。
      </div>

      <hr class="closed-divider">

      <div class="next-year">
        <span class="ny-icon">🌱</span>
        <div class="ny-title">明年再見！</div>
        <div class="ny-text">
          果園的桃樹正在準備休息，<br>
          等待明年春天再次開花結果 🌸<br>
          預計 <b style="font-weight:800">2027 年</b> 水蜜桃季再與您相見！
        </div>
      </div>

      <hr class="closed-divider">

      <div style="background:#fffbeb; border:1px dashed #fcd34d; border-radius:16px; padding:18px; text-align:center;">
        <div style="font-size:32px; margin-bottom:8px">🎁</div>
        <div style="font-size:16px; font-weight:800; color:#b45309; margin-bottom:6px">下個月季節限定商品</div>
        <div style="font-size:14px; color:#92400e; line-height:1.9;">
          敬請期待！<br>
          開賣時將於官方 LINE 第一時間通知 🔔
        </div>
      </div>

      <div class="thanks">
        感謝每一位訂購的朋友<br>
        您的支持是我們最大的動力 ❤️<br><br>
        如有任何問題請聯繫<br>
        <b>餘奶奶 0937-331355</b>
      </div>
    </div>
  </div>

  <script>
    // LIFF 初始化（保留以避免 LINE 開啟頁面時出錯）
    var LIFF_ID = '2009767596-jd7WjD99';
    async function init() {
      try {
        if (typeof liff !== 'undefined') {
          await liff.init({ liffId: LIFF_ID });
        }
      } catch (e) {
        console.warn('LIFF init:', e);
      }
    }
    init();
  </script>
</body>
</html>
