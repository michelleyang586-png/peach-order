<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餘有榮焉｜水蜜桃訂購</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    :root {
      --peach-main: #FF8A8A;
      --peach-light: #FFF0F0;
      --bg-color: #FAFAFA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-color); color: #444; line-height: 1.5;
    }
    .header {
      background: linear-gradient(145deg, #FF9A9E 0%, #FAD0C4 100%);
      color: white; padding: 40px 20px; text-align: center;
      border-radius: 0 0 30px 30px;
      box-shadow: 0 4px 15px rgba(255,138,138,0.3);
    }
    .header h1 { font-size: 24px; letter-spacing: 1px; }
    .header p  { font-size: 14px; margin-top: 8px; opacity: 0.9; }
    .container { padding: 20px 16px; max-width: 500px; margin: -20px auto 0; }
    .card {
      background: white; border-radius: 18px; padding: 20px;
      margin-bottom: 16px; box-shadow: 0 8px 24px rgba(149,157,165,0.1);
    }
    .card h2 { font-size: 16px; color: var(--peach-main); margin-bottom: 16px; }

    /* 取貨切換 */
    .delivery-toggle {
      display: flex; gap: 10px; background: #F0F0F0;
      padding: 4px; border-radius: 12px;
    }
    .delivery-btn {
      flex: 1; padding: 10px; border: none; border-radius: 10px;
      background: transparent; font-size: 14px; cursor: pointer; color: #777;
    }
    .delivery-btn.active {
      background: white; color: var(--peach-main); font-weight: bold;
    }

    /* 規格卡片 */
    .spec-card {
      border: 1px solid #EEE; border-radius: 14px;
      padding: 16px; margin-bottom: 12px; transition: 0.3s;
    }
    .spec-card.has-qty { border-color: var(--peach-main); background: var(--peach-light); }
    .spec-header {
      display: flex; justify-content: space-between; align-items: center;
    }
    .spec-name  { font-size: 16px; font-weight: 600; }
    .spec-price { font-size: 15px; color: var(--peach-main); font-weight: 700; }

    /* 數量控制：+/- 保留，中間改為可輸入 */
    .qty-control { display: flex; align-items: center; gap: 10px; }
    .qty-btn {
      width: 32px; height: 32px; border-radius: 10px; border: none;
      background: white; color: var(--peach-main); font-size: 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1); cursor: pointer; flex-shrink: 0;
    }
    .qty-input {
      width: 44px; height: 36px;
      border: 1.5px solid #DDD; border-radius: 8px;
      background: white;
      font-size: 17px; font-weight: bold; color: #444;
      text-align: center; padding: 0;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      -moz-appearance: textfield;
    }
    .qty-input::-webkit-inner-spin-button,
    .qty-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .qty-input:focus { outline: none; border-color: var(--peach-main); }
    .spec-card.has-qty .qty-input { border-color: var(--peach-main); color: var(--peach-main); }

    /* 收件資訊欄位 */
    .field label { font-size: 13px; font-weight: 600; color: #888; margin-bottom: 8px; display: block; }
    input[type="text"], input[type="tel"], textarea {
      background: #F9F9F9; border: 1px solid #EDEDED;
      padding: 14px; border-radius: 12px; font-size: 15px; width: 100%;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    /* 金額顯示 */
    .price-display { background: #333; color: #EEE; border-radius: 16px; padding: 20px; margin-top: 10px; }
    .price-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
    .price-total {
      display: flex; justify-content: space-between;
      font-size: 20px; font-weight: bold; color: white;
      border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; margin-top: 8px;
    }

    /* 送出按鈕 */
    .submit-btn {
      width: 100%; padding: 18px; background: var(--peach-main);
      color: white; border: none; border-radius: 18px;
      font-size: 17px; font-weight: bold; margin: 20px 0 40px; cursor: pointer;
    }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .peach-down { display: inline-block; transform: rotate(180deg); }
  </style>
</head>
<body>

<div id="main-screen">
  <div class="header">
    <h1>餘有榮焉 <span class="peach-down">&#x1F351;</span> 紅鈴水蜜桃</h1>
    <p>果園產地直送 ‧ 享受清甜滋味</p>
  </div>

  <div class="container">

    <!-- 取貨方式 -->
    <div class="card">
      <h2>取貨方式</h2>
      <div class="delivery-toggle">
        <button class="delivery-btn active" onclick="setDelivery('自取')" id="btn-pickup">
          &#x1F3EA; 現場自取
        </button>
        <button class="delivery-btn" onclick="setDelivery('宅配')" id="btn-delivery">
          &#x2744;&#xFE0F; 黑貓冷藏宅配
        </button>
      </div>
    </div>

    <!-- 規格選擇 -->
    <div class="card">
      <h2>挑選規格</h2>

      <div class="spec-card pickup-only" id="spec-card-0">
        <div class="spec-header">
          <div>
            <div class="spec-name">&#x1F351; 特2顆（自取限定）</div>
            <div class="spec-price">NT$ 150 / 盒</div>
          </div>
          <div class="qty-control">
            <button class="qty-btn" onclick="stepQty(0,-1)">&#x2212;</button>
            <input class="qty-input" type="number" id="qty-0" value="0" min="0" oninput="inputQty(0,this.value)">
            <button class="qty-btn" onclick="stepQty(0,1)">+</button>
          </div>
        </div>
      </div>

      <div class="spec-card pickup-only" id="spec-card-1">
        <div class="spec-header">
          <div>
            <div class="spec-name">&#x1F351; 特4顆（自取限定）</div>
            <div class="spec-price">NT$ 200 / 盒</div>
          </div>
          <div class="qty-control">
            <button class="qty-btn" onclick="stepQty(1,-1)">&#x2212;</button>
            <input class="qty-input" type="number" id="qty-1" value="0" min="0" oninput="inputQty(1,this.value)">
            <button class="qty-btn" onclick="stepQty(1,1)">+</button>
          </div>
        </div>
      </div>

      <div class="spec-card" id="spec-card-2">
        <div class="spec-header">
          <div>
            <div class="spec-name">&#x1F381; 禮盒大6顆</div>
            <div class="spec-price">NT$ 500 / 盒</div>
          </div>
          <div class="qty-control">
            <button class="qty-btn" onclick="stepQty(2,-1)">&#x2212;</button>
            <input class="qty-input" type="number" id="qty-2" value="0" min="0" oninput="inputQty(2,this.value)">
            <button class="qty-btn" onclick="stepQty(2,1)">+</button>
          </div>
        </div>
      </div>

      <div class="spec-card" id="spec-card-3">
        <div class="spec-header">
          <div>
            <div class="spec-name">&#x1F381; 禮盒大8顆</div>
            <div class="spec-price">NT$ 450 / 盒</div>
          </div>
          <div class="qty-control">
            <button class="qty-btn" onclick="stepQty(3,-1)">&#x2212;</button>
            <input class="qty-input" type="number" id="qty-3" value="0" min="0" oninput="inputQty(3,this.value)">
            <button class="qty-btn" onclick="stepQty(3,1)">+</button>
          </div>
        </div>
      </div>

      <div class="spec-card" id="spec-card-4">
        <div class="spec-header">
          <div>
            <div class="spec-name">&#x1F351; 家庭盒中16顆</div>
            <div class="spec-price">NT$ 400 / 盒</div>
          </div>
          <div class="qty-control">
            <button class="qty-btn" onclick="stepQty(4,-1)">&#x2212;</button>
            <input class="qty-input" type="number" id="qty-4" value="0" min="0" oninput="inputQty(4,this.value)">
            <button class="qty-btn" onclick="stepQty(4,1)">+</button>
          </div>
        </div>
      </div>

      <p id="empty-warning" style="color:#ff6b6b;font-size:13px;text-align:center;display:none;">
        別忘了選購好吃的水蜜桃喔！
      </p>
    </div>

    <!-- 收件資訊 -->
    <div class="card">
      <h2>收件資訊</h2>
      <div class="field" style="margin-bottom:15px;">
        <label>聯絡姓名</label>
        <input type="text" id="name" placeholder="請填寫姓名">
      </div>
      <div class="field" style="margin-bottom:15px;">
        <label>手機號碼</label>
        <input type="tel" id="phone" placeholder="09XX-XXX-XXX">
      </div>
      <div class="field" id="address-section" style="margin-bottom:15px;display:none;">
        <label>宅配地址</label>
        <input type="text" id="address" placeholder="完整收件地址">
      </div>
      <div class="field">
        <label>備註需求</label>
        <textarea id="note" rows="2"></textarea>
      </div>
    </div>

    <!-- 金額顯示 -->
    <div class="price-display" id="price-display">
      <div class="price-total"><span>總計金額</span><span>NT$ 0</span></div>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitOrder()">
      確認送出訂單
    </button>

  </div>
</div>

<script>
  var LIFF_ID  = '2009767596-jd7WjD99';
  var API_URL  = 'https://peach-api-indol.vercel.app/api/order';
  var SHIPPING_PER_BOX = 290;

  var SPECS = [
    { name: '特2顆',        price: 150, pickupOnly: true  },
    { name: '特4顆',        price: 200, pickupOnly: true  },
    { name: '禮盒大6顆',    price: 500, pickupOnly: false },
    { name: '禮盒大8顆',    price: 450, pickupOnly: false },
    { name: '家庭盒中16顆', price: 400, pickupOnly: false }
  ];

  // qtys[] 是唯一的資料來源，UI 永遠從這裡讀
  var qtys = [0, 0, 0, 0, 0];
  var deliveryType = '自取';
  var lineName = '';
  var lineUserId = '';

  // ── 共用：把 qtys[idx] 寫回畫面（input.value + 卡片樣式）
  function syncUI(idx) {
    var el = document.getElementById('qty-' + idx);
    el.value = qtys[idx];
    var base = 'spec-card' + (SPECS[idx].pickupOnly ? ' pickup-only' : '');
    document.getElementById('spec-card-' + idx).className = base + (qtys[idx] > 0 ? ' has-qty' : '');
  }

  // ── +/- 按鈕 ─────────────────────────────────────────────
  function stepQty(idx, delta) {
    qtys[idx] = Math.max(0, qtys[idx] + delta);
    syncUI(idx);
    document.getElementById('empty-warning').style.display = 'none';
    updatePriceDisplay();
  }

  // ── 直接輸入 ──────────────────────────────────────────────
  function inputQty(idx, val) {
    var n = parseInt(val, 10);
    qtys[idx] = (isNaN(n) || n < 0) ? 0 : n;
    // 不強制寫回 input.value，避免輸入中游標跳動；只更新卡片樣式
    var base = 'spec-card' + (SPECS[idx].pickupOnly ? ' pickup-only' : '');
    document.getElementById('spec-card-' + idx).className = base + (qtys[idx] > 0 ? ' has-qty' : '');
    document.getElementById('empty-warning').style.display = 'none';
    updatePriceDisplay();
  }

  // ── LIFF 初始化 ──────────────────────────────────────────
  async function init() {
    try {
      if (typeof liff === 'undefined') {
        console.warn('LIFF SDK 未載入，以一般瀏覽器模式運行');
      } else {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          var profile = await liff.getProfile();
          lineName   = profile.displayName;
          lineUserId = profile.userId;
        } else {
          liff.login();
          return;
        }
      }
    } catch (e) {
      console.warn('LIFF init failed:', e);
    }
    updateSpecVisibility();
    updatePriceDisplay();
  }

  // ── 取貨方式切換 ─────────────────────────────────────────
  function setDelivery(type) {
    deliveryType = type;
    document.getElementById('btn-pickup').className   = 'delivery-btn' + (type === '自取' ? ' active' : '');
    document.getElementById('btn-delivery').className = 'delivery-btn' + (type === '宅配' ? ' active' : '');
    document.getElementById('address-section').style.display = type === '宅配' ? 'block' : 'none';
    updateSpecVisibility();
    updatePriceDisplay();
  }

  // ── 顯示/隱藏自取限定規格，切宅配時強制清零 ──────────────
  function updateSpecVisibility() {
    document.querySelectorAll('.pickup-only').forEach(function(card) {
      card.style.display = deliveryType === '自取' ? 'block' : 'none';
    });
    if (deliveryType === '宅配') {
      // 清零自取限定兩項，並同步畫面
      qtys[0] = 0;
      qtys[1] = 0;
      syncUI(0);
      syncUI(1);
    }
  }

  // ── 運費計算 ──────────────────────────────────────────────
  function calcShipping() {
    if (deliveryType !== '宅配') return 0;
    var boxes = qtys[2] + qtys[3] + qtys[4];
    if (boxes === 0) return 0;
    return Math.ceil(boxes / 2) * SHIPPING_PER_BOX;
  }

  // ── 金額顯示更新（讀 qtys[]，不讀 DOM）────────────────────
  function updatePriceDisplay() {
    var html = '';
    var subtotal = 0;
    for (var i = 0; i < SPECS.length; i++) {
      if (qtys[i] <= 0) continue;
      var amount = qtys[i] * SPECS[i].price;
      subtotal += amount;
      html += '<div class="price-row"><span>' + SPECS[i].name + ' x ' + qtys[i] + '</span><span>NT$ ' + amount + '</span></div>';
    }
    var shipping = calcShipping();
    if (shipping > 0) {
      html += '<div class="price-row"><span>黑貓冷藏宅配運費</span><span>NT$ ' + shipping + '</span></div>';
    }
    var total = subtotal + shipping;
    html += '<div class="price-total"><span>總計金額</span><span>NT$ ' + total + '</span></div>';
    document.getElementById('price-display').innerHTML = html;
  }

  // ── 送出訂單 ──────────────────────────────────────────────
  async function submitOrder() {
    var name    = document.getElementById('name').value.trim();
    var phone   = document.getElementById('phone').value.trim();
    var address = document.getElementById('address').value.trim();
    var note    = document.getElementById('note').value.trim();

    // 送出前再從 input 同步一次 qtys，防止直接輸入後沒 blur
    for (var j = 0; j < 5; j++) {
      var v = parseInt(document.getElementById('qty-' + j).value, 10);
      qtys[j] = (isNaN(v) || v < 0) ? 0 : v;
    }

    var totalBoxes = qtys.reduce(function(a, b) { return a + b; }, 0);
    if (totalBoxes === 0) {
      document.getElementById('empty-warning').style.display = 'block';
      return;
    }
    if (!name || !phone) { alert('請填寫姓名和電話'); return; }
    if (deliveryType === '宅配' && !address) { alert('請填寫宅配地址'); return; }

    var shipping = calcShipping();
    var subtotal = 0;
    for (var i = 0; i < SPECS.length; i++) { subtotal += qtys[i] * SPECS[i].price; }
    var totalAmount = subtotal + shipping;

    var specSummary = SPECS.map(function(s, i) {
      return qtys[i] > 0 ? s.name + ' x' + qtys[i] : null;
    }).filter(Boolean).join('、');

    var btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = '訂單處理中...';

    try {
      var params = new URLSearchParams({
        action: 'order',
        lineName: lineName || name,
        recipientName: name,
        lineUserId: lineUserId || '',
        phone: phone,
        deliveryType: deliveryType,
        spec0: String(qtys[0]),
        spec1: String(qtys[1]),
        spec2: String(qtys[2]),
        spec3: String(qtys[3]),
        spec4: String(qtys[4]),
        specSummary: specSummary,
        amount: String(totalAmount),
        address: address || '自取',
        note: note || ''
      });

      var res    = await fetch(API_URL + '?' + params.toString());
      var result = await res.json();

      if (result.status === 'success') {
        alert('訂單送出成功！');
        location.reload();
      } else {
        throw new Error('API returned non-success status');
      }
    } catch (e) {
      console.error('Submit error:', e);
      var msg = e.message && e.message.includes('Failed to fetch')
        ? '網路連線失敗，請確認網路後再試'
        : '送出失敗，請稍後再試';
      alert(msg);
      btn.disabled = false;
      btn.textContent = '確認送出訂單';
    }
  }

  init();
</script>
</body>
</html>
