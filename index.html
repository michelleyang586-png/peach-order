<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餘有榮焉｜水蜜桃訂購</title>

  <style>
    :root {
      --peach-main: #FF8A8A;
      --peach-light: #FFF0F0;
      --bg-color: #FAFAFA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-color);
      color: #444;
      line-height: 1.5;
    }

    .header {
      background: linear-gradient(145deg, #FF9A9E 0%, #FAD0C4 100%);
      color: white;
      padding: 40px 20px;
      text-align: center;
      border-radius: 0 0 30px 30px;
      box-shadow: 0 4px 15px rgba(255,138,138,0.3);
    }

    .header h1 {
      font-size: 24px;
      letter-spacing: 1px;
    }

    .header p {
      font-size: 14px;
      margin-top: 8px;
      opacity: 0.9;
    }

    .container {
      padding: 20px 16px;
      max-width: 500px;
      margin: -20px auto 0;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(149,157,165,0.1);
    }

    .card h2 {
      font-size: 16px;
      color: var(--peach-main);
      margin-bottom: 16px;
    }

    .delivery-toggle {
      display: flex;
      gap: 10px;
      background: #F0F0F0;
      padding: 4px;
      border-radius: 12px;
    }

    .delivery-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: transparent;
      font-size: 14px;
      cursor: pointer;
      color: #777;
    }

    .delivery-btn.active {
      background: white;
      color: var(--peach-main);
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(255,138,138,0.15);
    }

    .spec-card {
      border: 1px solid #EEE;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      transition: 0.3s;
    }

    .spec-card.has-qty {
      border-color: var(--peach-main);
      background: var(--peach-light);
    }

    .spec-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .spec-name {
      font-size: 16px;
      font-weight: 600;
    }

    .spec-price {
      font-size: 15px;
      color: var(--peach-main);
      font-weight: 700;
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: none;
      background: white;
      color: var(--peach-main);
      font-size: 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
      flex-shrink: 0;
    }

    .qty-input {
      width: 44px;
      height: 36px;
      border: 1.5px solid #DDD;
      border-radius: 8px;
      background: white;
      font-size: 17px;
      font-weight: bold;
      color: #444;
      text-align: center;
      padding: 0;
    }

    .pickup-tag {
      display: inline-block;
      font-size: 11px;
      color: #fff;
      background: var(--peach-main);
      border-radius: 6px;
      padding: 1px 7px;
      margin-left: 6px;
    }

    .field label {
      font-size: 13px;
      font-weight: 600;
      color: #888;
      margin-bottom: 8px;
      display: block;
    }

    input[type="text"],
    input[type="tel"],
    textarea {
      background: #F9F9F9;
      border: 1px solid #EDEDED;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      width: 100%;
    }

    .pickup-info {
      background: #FFF8F8;
      border: 1px dashed #FFBABA;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      font-size: 13px;
      color: #888;
      line-height: 1.8;
    }

    .price-display {
      background: #333;
      color: #EEE;
      border-radius: 16px;
      padding: 20px;
      margin-top: 10px;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .price-total {
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      color: white;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 12px;
      margin-top: 8px;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: var(--peach-main);
      color: white;
      border: none;
      border-radius: 18px;
      font-size: 17px;
      font-weight: bold;
      margin: 20px 0 40px;
      cursor: pointer;
    }

    #success-screen {
      display: none;
      min-height: 100vh;
      background: linear-gradient(145deg, #FF9A9E 0%, #FAD0C4 100%);
      padding: 40px 20px;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="main-screen">
  <div class="header">
    <h1>餘有榮焉 🍑 紅鈴水蜜桃</h1>
    <p>果園產地直送 ‧ 享受清甜滋味</p>
  </div>

  <div class="container">

    <div class="card">
      <h2>取貨方式</h2>

      <div class="delivery-toggle">
        <button class="delivery-btn active" onclick="setDelivery('自取')" id="btn-pickup">
          🏪 現場自取
        </button>

        <button class="delivery-btn" onclick="setDelivery('宅配')" id="btn-delivery">
          ❄️ 黑貓冷藏宅配
        </button>
      </div>
    </div>

    <div class="card">
      <h2>挑選規格</h2>

      <div class="spec-card pickup-only" id="spec-card-0">
        <div class="spec-header">
          <div>
            <div class="spec-name">🍑 特2顆 <span class="pickup-tag">自取限定</span></div>
            <div class="spec-price">NT$ 150 / 盒</div>
          </div>

          <div class="qty-control">
            <button class="qty-btn" onclick="stepQty(0,-1)">−</button>
            <input class="qty-input" type="number" id="qty-0" value="0" min="0" oninput="inputQty(0,this.value)">
            <button class="qty-btn" onclick="stepQty(0,1)">+</button>
          </div>
        </div>
      </div>

      <div class="spec-card pickup-only" id="spec-card-1">
        <div class="spec-header">
          <div>
            <div class="spec-name">🍑 特4顆 <span class="pickup-tag">自取限定</span></div>
            <div class="spec-price">NT$ 200 / 盒</div>
          </div>

          <div class="qty-control">
            <button class="qty-btn" onclick="stepQty(1,-1)">−</button>
            <input class="qty-input" type="number" id="qty-1" value="0" min="0" oninput="inputQty(1,this.value)">
            <button class="qty-btn" onclick="stepQty(1,1)">+</button>
          </div>
        </div>
      </div>

    </div>

    <div class="card">
      <h2>收件資訊</h2>

      <div class="field" style="margin-bottom:15px;">
        <label>聯絡姓名</label>
        <input type="text" id="name" placeholder="請填寫姓名">
      </div>

      <div class="field" style="margin-bottom:15px;">
        <label>手機號碼</label>
        <input type="tel" id="phone" placeholder="09XX-XXX-XXX">
      </div>

      <div class="field" id="address-section" style="margin-bottom:15px;display:none;">
        <label>宅配地址</label>
        <input type="text" id="address" placeholder="完整收件地址">
      </div>
    </div>

    <div class="price-display" id="price-display">
      <div class="price-total">
        <span>總計金額</span>
        <span>NT$ 0</span>
      </div>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitOrder()">
      確認送出訂單
    </button>

  </div>
</div>

<div id="success-screen">
  <h1 style="color:white;">🎉 訂單成立</h1>
</div>

<script>

  var API_URL = 'https://peach-api-indol.vercel.app/api/order';
  var SHIPPING_PER_BOX = 290;

  var SPECS = [
    { name: '特2顆', price: 150, pickupOnly: true },
    { name: '特4顆', price: 200, pickupOnly: true }
  ];

  var qtys = [0,0];
  var deliveryType = '自取';

  function syncUI(idx) {
    document.getElementById('qty-' + idx).value = qtys[idx];
  }

  function stepQty(idx, delta) {
    qtys[idx] = Math.max(0, qtys[idx] + delta);
    syncUI(idx);
    updatePriceDisplay();
  }

  function inputQty(idx, val) {
    qtys[idx] = parseInt(val, 10) || 0;
    updatePriceDisplay();
  }

  function setDelivery(type) {
    deliveryType = type;

    document.getElementById('btn-pickup').className =
      'delivery-btn' + (type === '自取' ? ' active' : '');

    document.getElementById('btn-delivery').className =
      'delivery-btn' + (type === '宅配' ? ' active' : '');

    document.getElementById('address-section').style.display =
      type === '宅配' ? 'block' : 'none';
  }

  function calcShipping() {
    if (deliveryType !== '宅配') return 0;

    var total = qtys.reduce((a,b) => a+b, 0);

    if (total === 0) return 0;

    return Math.ceil(total / 2) * SHIPPING_PER_BOX;
  }

  function updatePriceDisplay() {
    var subtotal = 0;

    for (var i=0; i<SPECS.length; i++) {
      subtotal += qtys[i] * SPECS[i].price;
    }

    var shipping = calcShipping();
    var total = subtotal + shipping;

    document.getElementById('price-display').innerHTML =
      '<div class="price-total"><span>總計金額</span><span>NT$ ' + total + '</span></div>';
  }

  function showSuccessScreen() {
    document.getElementById('main-screen').style.display = 'none';
    document.getElementById('success-screen').style.display = 'block';
  }

  async function submitOrder() {

    var name = document.getElementById('name').value.trim();
    var phone = document.getElementById('phone').value.trim();
    var address = document.getElementById('address').value.trim();

    if (!name || !phone) {
      alert('請填寫姓名與電話');
      return;
    }

    if (deliveryType === '宅配' && !address) {
      alert('請填寫宅配地址');
      return;
    }

    var shipping = calcShipping();

    var subtotal = 0;

    for (var i=0; i<SPECS.length; i++) {
      subtotal += qtys[i] * SPECS[i].price;
    }

    var totalAmount = subtotal + shipping;

    var specSummary = SPECS.map(function(s, i) {
      return qtys[i] > 0 ? s.name + ' x' + qtys[i] : null;
    }).filter(Boolean).join('、');

    try {

      var params = new URLSearchParams({
        action: 'order',
        recipientName: name,
        phone: phone,
        deliveryType: deliveryType,
        specSummary: specSummary,
        amount: String(totalAmount),
        address: address || '自取'
      });

      var res = await fetch(API_URL + '?' + params.toString());
      var result = await res.json();

      if (result.status === 'success') {
        showSuccessScreen();
      } else {
        alert('送出失敗');
      }

    } catch(e) {
      console.error(e);
      alert('送出失敗');
    }
  }

  function init() {
    updatePriceDisplay();
  }

  init();

</script>

</body>
</html>
